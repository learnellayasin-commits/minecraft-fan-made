<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
        }
        #survival { position:absolute; bottom:18px; left:18px; right:18px; width:fit-content; max-width:calc(100% - 52px); color:white; background:#0009; padding:8px; font-family:monospace; pointer-events:none; }
        .inventory {display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.slot{border:2px solid #aaa;background:#333;padding:8px;min-width:42px;text-align:center}.selected{border-color:#ffda62;background:#62552d}
        #status,#notice{position:absolute;color:white;background:#0009;padding:6px;right:10px;top:10px}#notice{top:45px}
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="info">
        <div>WASD - Move</div>
        <div>Space - Jump</div>
        <div>Mouse - Look around</div>
        <div>Left Click - Hit animal/player or break block</div>
        <div>E - Eat meat; walk near meat to pick up</div>
        <div>Right Click - Place block</div>
        <div>1-5 - Select block type</div>
    </div>
    <div id="instructions">
        Click to start playing
    </div>
    <div id="survival">❤❤❤❤❤❤❤❤❤❤ &nbsp; 🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗<br>Inventory: [ meat: 0 ] [ grass ] [ dirt ]</div>
    <div id="status">Connecting...</div><div id="notice" role="status"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
